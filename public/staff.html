<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Staff — Bridge Out of Poverty</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="/styles.css">
  <script src="/common.js" defer></script>
  <script src="/staff.js" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/staff">Bridge <span>Out of Poverty</span> · Staff</a>
    <nav>
      <a href="/?staff=1">New assisted intake</a>
      <a href="/directory">Public directory</a>
      <a href="#" id="logout" class="hidden">Sign out</a>
    </nav>
  </header>

  <main class="wide">
    <section id="login" class="card hidden">
      <h1>Staff sign in</h1>
      <form id="loginForm" class="toolbar">
        <label class="grow">Password <input type="password" id="password" autocomplete="current-password" required></label>
        <button class="btn" type="submit">Sign in</button>
      </form>
      <div id="loginError"></div>
    </section>

    <section id="app" class="hidden">
      <div class="tabs" role="tablist">
        <button role="tab" data-tab="dashboard" aria-selected="true">Dashboard</button>
        <button role="tab" data-tab="clients" aria-selected="false">Youth &amp; follow-ups</button>
        <button role="tab" data-tab="resources" aria-selected="false">Resources</button>
        <button role="tab" data-tab="discover" aria-selected="false">Discover</button>
      </div>
      <div id="tab-dashboard" role="tabpanel"></div>
      <div id="tab-clients" role="tabpanel" class="hidden"></div>
      <div id="tab-resources" role="tabpanel" class="hidden"></div>
      <div id="tab-discover" role="tabpanel" class="hidden"></div>
    </section>
  </main>

  <dialog id="dialog"><div class="card" id="dialogBody"></div></dialog>
</body>
</html>
