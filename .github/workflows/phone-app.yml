name: Phone app

# Builds the iPhone (Home Screen) app, refreshes public data (federal
# grants, IRS registry, watched pages, website checks), and publishes it to
# GitHub Pages. Runs on pushes to main, every Monday, and on demand.

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 10 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Refresh public data
        run: node --disable-warning=ExperimentalWarning scripts/publish-data.js
        timeout-minutes: 30
      - run: node scripts/build-mobile.js site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
